name: Repository Reports

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-reports-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reporting tools
        run: python -m pip install -r tools/trace/requirements.txt -r tools/code_metrics/requirements.txt
      - name: Test traceability tool
        run: python -m unittest discover -s tools/trace
      - name: Validate traceability
        run: python tools/trace/trace.py validate
      - name: Test code metrics tool
        run: python -m unittest discover -s tools/code_metrics
