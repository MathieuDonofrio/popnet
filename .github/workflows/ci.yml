name: Build & Tests

on:
  push:
    branches-ignore: [code-metrics-history]
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run all platforms, compilers, build types, and native settings
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.select.outputs.builds }}
    steps:
      - name: Select build matrix
        uses: actions/github-script@v7
        id: select
        env:
          FULL_MATRIX: ${{ inputs.full_matrix || false }}
        with:
          script: |
            const debugPortable = { build_type: 'Debug', native: 'OFF' };
            const platforms = [
              { runner: 'windows-2022', arch: 'x64', compiler: 'cl', standard: debugPortable },
              { runner: 'windows-11-vs2026-arm', arch: 'arm64', compiler: 'cl' },
              { runner: 'windows-2022', arch: 'x64', compiler: 'clang-cl' },
              { runner: 'windows-11-vs2026-arm', arch: 'arm64', compiler: 'clang-cl' },
              { runner: 'ubuntu-24.04', arch: 'x64', compiler: 'g++', standard: debugPortable },
              { runner: 'ubuntu-24.04-arm', arch: 'arm64', compiler: 'g++' },
              { runner: 'ubuntu-24.04', arch: 'x64', compiler: 'clang++' },
              { runner: 'ubuntu-24.04-arm', arch: 'arm64', compiler: 'clang++' },
              { runner: 'macos-15-intel', arch: 'x64', compiler: 'clang++' },
              { runner: 'macos-15', arch: 'arm64', compiler: 'clang++',
                standard: { build_type: 'RelWithDebInfo', native: 'ON' } },
            ];
            const full = process.env.FULL_MATRIX === 'true';
            const builds = platforms.flatMap(({ standard, ...platform }) => {
              if (!full) return standard ? [{ ...platform, ...standard }] : [];
              return ['Debug', 'RelWithDebInfo'].flatMap(build_type =>
                ['ON', 'OFF'].map(native => ({ ...platform, build_type, native })));
            });
            core.setOutput('builds', { include: builds });

  test:
    needs: matrix
    name: ${{ matrix.runner }} / ${{ matrix.compiler }} / ${{ matrix.build_type }} / native=${{ matrix.native }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.builds) }}
    defaults:
      run:
        shell: bash
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
      - name: Locate ARM64 ASan runtime
        if: runner.os == 'Windows' && matrix.arch == 'arm64' && matrix.compiler == 'cl' && matrix.build_type == 'Debug'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:VCToolsInstallDir 'bin/Hostarm64/arm64'
          if (!(Test-Path "$runtime/clang_rt.asan_dynamic-aarch64.dll")) {
            throw "ARM64 ASan runtime missing from $runtime"
          }
          $runtime >> $env:GITHUB_PATH
      - name: Configure
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          COMPILER: ${{ matrix.compiler }}
          NATIVE: ${{ matrix.native }}
          ARCH: ${{ matrix.arch }}
        run: |
          asan=OFF
          ubsan=OFF
          extra=()
          if [[ "$BUILD_TYPE" == Debug && "$COMPILER" != clang-cl ]]; then
            asan=ON
            if [[ "$RUNNER_OS" != Windows ]]; then
              ubsan=ON
            fi
          fi
          if [[ "$RUNNER_OS" == Windows && "$COMPILER" == clang-cl ]]; then
            if [[ "$ARCH" == arm64 ]]; then
              extra+=(-DCMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc)
            else
              extra+=(-DCMAKE_CXX_COMPILER_TARGET=x86_64-pc-windows-msvc)
            fi
          fi
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_CXX_COMPILER="$COMPILER" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DPOPNET_BUILD_TESTS=ON -DPOPNET_BUILD_BENCHMARKS=OFF \
            -DPOPNET_NATIVE="$NATIVE" -DPOPNET_ASAN="$asan" -DPOPNET_UBSAN="$ubsan" \
            "${extra[@]}"
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COVERAGE_PRESET: linux-clang-coverage
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libclang-rt-18-dev ninja-build
      - name: Configure
        run: cmake --preset "$COVERAGE_PRESET" -DCMAKE_CXX_COMPILER=clang++-18
      - name: Collect coverage
        run: cmake --build "build/$COVERAGE_PRESET" --target coverage --parallel 2
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/${{ env.COVERAGE_PRESET }}/coverage/
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install code report tools
        run: python -m pip install -r tools/trace/requirements.txt -r tools/code_metrics/requirements.txt -r tools/report/requirements.txt
      - name: Test dashboard generator
        run: python -m unittest discover -s tools/report
      - name: Generate code report dashboard
        run: |
          python tools/report/generate.py --coverage-json "build/$COVERAGE_PRESET/coverage/coverage.json" \
            --badges-dir badge --metrics-snapshot metrics-snapshot.json --branch-snapshot branch-report.json
      - name: Upload code report dashboard
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: popnet-code-report
          path: report/index.html
          if-no-files-found: error
      - name: Upload branch report snapshot
        if: github.ref_type == 'branch' && github.ref != 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: branch-report
          path: branch-report.json
          if-no-files-found: error
      - name: Stage report and metrics
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: code-report-inputs
          path: |
            report/index.html
            badge/
            metrics-snapshot.json
          if-no-files-found: error

  publish-metrics:
    needs: coverage
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      METRICS_BRANCH: code-metrics-history
    steps:
      - uses: actions/checkout@v4
      - name: Download report and metrics
        uses: actions/download-artifact@v4
        with:
          name: code-report-inputs
      - name: Record and publish metrics
        id: publish
        shell: bash
        run: |
          main_ref=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "${main_ref%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "Skipping publication because this run is no longer at the tip of main."
            exit 0
          fi

          history_dir="$RUNNER_TEMP/$METRICS_BRANCH"
          history_ref="refs/heads/$METRICS_BRANCH"
          if git ls-remote --exit-code origin "$history_ref"; then
            git fetch --no-tags origin "$history_ref"
            git worktree add --detach "$history_dir" FETCH_HEAD
          else
            status=$?
            if [[ "$status" != 2 ]]; then exit "$status"; fi
            git worktree add --detach --no-checkout "$history_dir" HEAD
            git -C "$history_dir" switch --orphan "$METRICS_BRANCH"
          fi

          python tools/report/history.py --snapshot metrics-snapshot.json \
            --history "$history_dir/history.json" --report report/index.html
          for badge in coverage.json traceability.json sloc.json cognitive-complexity.json; do
            cp "badge/$badge" "$history_dir/"
            git -C "$history_dir" add "$badge"
          done
          git -C "$history_dir" add history.json
          if ! git -C "$history_dir" diff --cached --quiet; then
            git -C "$history_dir" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Record metrics for $GITHUB_SHA"
            git -C "$history_dir" push origin "HEAD:$history_ref"
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Upload code report dashboard
        if: steps.publish.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: popnet-code-report
          path: report/index.html
          if-no-files-found: error
