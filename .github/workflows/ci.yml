name: Build & Tests

on:
  push:
    branches-ignore: [code-metrics-history]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.arch }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, macos]
        compiler: [gcc, clang, msvc]
        arch: [x64, arm64]
        build_type: [Debug, Release]
        exclude:
          - { os: linux, compiler: msvc }
          - { os: windows, compiler: gcc }
          - { os: macos, compiler: gcc }
          - { os: macos, compiler: msvc }
        include:
          - { os: linux, arch: x64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: x64, runner: windows-2022 }
          - { os: windows, arch: arm64, runner: windows-11-vs2026-arm }
          - { os: macos, arch: x64, runner: macos-15-intel }
          - { os: macos, arch: arm64, runner: macos-15 }
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
      - name: Locate ARM64 ASan runtime
        if: runner.os == 'Windows' && matrix.arch == 'arm64' && matrix.compiler == 'msvc' && matrix.build_type == 'Debug'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:VCToolsInstallDir 'bin/Hostarm64/arm64'
          if (!(Test-Path "$runtime/clang_rt.asan_dynamic-aarch64.dll")) {
            throw "ARM64 ASan runtime missing from $runtime"
          }
          $runtime >> $env:GITHUB_PATH
      - name: Configure
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          TOOLCHAIN: ${{ matrix.compiler }}
          ARCH: ${{ matrix.arch }}
        run: |
          extra=()
          case "$RUNNER_OS/$TOOLCHAIN" in
            Windows/msvc) compiler=cl ;;
            Windows/clang)
              compiler=clang-cl
              target=x86_64
              if [[ "$ARCH" == arm64 ]]; then
                target=aarch64
              fi
              extra+=("-DCMAKE_CXX_COMPILER_TARGET=$target-pc-windows-msvc")
              ;;
            */gcc) compiler=g++ ;;
            */clang) compiler=clang++ ;;
          esac

          if [[ "$BUILD_TYPE" == Debug && "$compiler" != clang-cl ]]; then
            extra+=(-DPOPNET_ASAN=ON)
            if [[ "$RUNNER_OS" != Windows ]]; then
              extra+=(-DPOPNET_UBSAN=ON)
            fi
          fi
          cmake -S . -B build/ci -G Ninja -DCMAKE_CXX_COMPILER="$compiler" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPOPNET_BUILD_TESTS=ON "${extra[@]}"
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COVERAGE_PRESET: linux-clang-coverage
      REPORT_KIND: >-
        ${{ github.event_name != 'pull_request' && github.ref_type == 'branch' &&
            (github.ref == 'refs/heads/main' && 'history' || 'branch') || 'standalone' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libclang-rt-18-dev ninja-build
      - name: Run tests with sanitizers
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build/linux-clang-sanitizers -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Debug \
            -DPOPNET_BUILD_TESTS=ON -DPOPNET_ASAN=ON -DPOPNET_UBSAN=ON
          cmake --build build/linux-clang-sanitizers --parallel 2
          ctest --test-dir build/linux-clang-sanitizers --output-on-failure --no-tests=error
      - name: Configure
        run: cmake --preset "$COVERAGE_PRESET" -DCMAKE_CXX_COMPILER=clang++-18
      - name: Collect coverage
        run: cmake --build "build/$COVERAGE_PRESET" --target coverage --parallel 2
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/${{ env.COVERAGE_PRESET }}/coverage/
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install code report tools
        run: python -m pip install -r tools/trace/requirements.txt -r tools/code_metrics/requirements.txt -r tools/report/requirements.txt
      - name: Test dashboard generator
        run: python -m unittest discover -s tools/report
      - name: Generate code report dashboard
        run: |
          outputs=()
          case "$REPORT_KIND" in
            history) outputs+=(--badges-dir badge --metrics-snapshot metrics-snapshot.json) ;;
            branch)  outputs+=(--branch-snapshot branch-report.json) ;;
          esac
          python tools/report/generate.py --project-name Popnet --coverage-json "build/$COVERAGE_PRESET/coverage/coverage.json" \
            "${outputs[@]}"
      - name: Upload code report dashboard
        if: env.REPORT_KIND != 'history'
        uses: actions/upload-artifact@v4
        with:
          name: popnet-code-report
          path: report/index.html
          if-no-files-found: error
      - name: Upload branch report snapshot
        if: env.REPORT_KIND == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: branch-report
          path: branch-report.json
          if-no-files-found: error
      - name: Stage report and metrics
        if: env.REPORT_KIND == 'history'
        uses: actions/upload-artifact@v4
        with:
          name: code-report-inputs
          path: |
            report/index.html
            badge/
            metrics-snapshot.json
          if-no-files-found: error

  publish-metrics:
    needs: coverage
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      METRICS_BRANCH: code-metrics-history
    steps:
      - uses: actions/checkout@v4
      - name: Download report and metrics
        uses: actions/download-artifact@v4
        with:
          name: code-report-inputs
      - name: Record and publish metrics
        id: publish
        run: |
          main_ref=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "${main_ref%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "Skipping publication because this run is no longer at the tip of main."
            exit 0
          fi

          history_dir="$RUNNER_TEMP/$METRICS_BRANCH"
          history_ref="refs/heads/$METRICS_BRANCH"
          if git ls-remote --exit-code origin "$history_ref"; then
            git fetch --no-tags origin "$history_ref"
            git worktree add --detach "$history_dir" FETCH_HEAD
          else
            status=$?
            if [[ "$status" != 2 ]]; then exit "$status"; fi
            git worktree add --detach --no-checkout "$history_dir" HEAD
            git -C "$history_dir" switch --orphan "$METRICS_BRANCH"
          fi

          python tools/report/history.py --snapshot metrics-snapshot.json \
            --history "$history_dir/history.json" --report report/index.html
          badges=(coverage.json traceability.json sloc.json cognitive-complexity.json)
          (cd badge && cp "${badges[@]}" "$history_dir/")
          git -C "$history_dir" add -- history.json "${badges[@]}"
          if ! git -C "$history_dir" diff --cached --quiet; then
            git -C "$history_dir" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Record metrics for $GITHUB_SHA"
            git -C "$history_dir" push origin "HEAD:$history_ref"
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Upload code report dashboard
        if: steps.publish.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: popnet-code-report
          path: report/index.html
          if-no-files-found: error
