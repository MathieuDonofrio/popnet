# General Layout

line_width: 120
line_ending: unix
tab_size: 2

dangle_parens: true
dangle_align: prefix
command_case: lower
keyword_case: upper

# Spacing

separate_ctrl_name_with_space: false
separate_fn_name_with_space: false

# Wrapping

max_pargs_hwrap: 3

# Comments

bullet_char: '*'
enum_char: .